<!-- ============================================================
     ICON SPRITE: every glyph the site uses, defined once.
     ============================================================
     Inlined by build.mjs as the first element in <body>, so a
     <use href="#i-won"> anywhere in the document resolves without a
     network request and without a second copy of the path data.

     Rules:
       · 24x24 viewBox throughout, so any icon can be swapped for any
         other without touching layout.
       · Strokes are 1.9 with round caps and joins. Fills are
         currentColor. Nothing carries its own colour, because the
         outcome glyphs must take #86EFAC and #FCA5A5 from the
         semantic tokens rather than approximating them, which is
         exactly what the emoji they replaced could not do.
       · Never rely on an emoji for meaning: emoji rasterise from the
         system font, so they ignore the theme, ignore the semantic
         colours, and render differently on every platform. Every
         icon here is decorative and paired with real text.
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true" focusable="false"><defs>

  <!-- ── outcome markers. Filled disc + knocked-out mark, so they read
       at 16px on a phone where a hairline stroke would disappear. ── -->
  <symbol id="i-won" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="currentColor" opacity=".18"/>
    <path d="M7.4 12.4l3.1 3.1 6.1-6.9" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-lost" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="currentColor" opacity=".18"/>
    <path d="M8.6 8.6l6.8 6.8M15.4 8.6l-6.8 6.8" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-cash" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="currentColor" opacity=".18"/>
    <path d="M14.8 9.1c-.5-.8-1.5-1.3-2.7-1.3-1.7 0-2.9.9-2.9 2.2 0 3 5.8 1.4 5.8 4.4 0 1.3-1.3 2.3-3 2.3-1.3 0-2.4-.5-2.9-1.4"
          fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
    <path d="M12 6.1v11.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
  </symbol>
  <symbol id="i-void" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="currentColor" opacity=".18"/>
    <path d="M15.6 15.4H10a2.9 2.9 0 0 1 0-5.8h4.6" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12.8 7.2L15.4 9.6 12.8 12" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-pending" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="currentColor" opacity=".18"/>
    <path d="M12 7.2V12l3 1.8" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="i-ask" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="currentColor" opacity=".18"/>
    <path d="M9.7 9.4a2.4 2.4 0 1 1 3.2 2.3c-.6.2-.9.8-.9 1.4v.4" fill="none"
          stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="16.4" r="1.05" fill="currentColor"/>
  </symbol>

  <!-- ── brand marks ── -->
  <symbol id="i-telegram" viewBox="0 0 24 24">
    <path fill="currentColor" d="M21.9 4.3l-3.1 14.9c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.2L4.3 13.2l-4.8-1.5c-1-.3-1-1 .2-1.5L20.6 2.3c.9-.3 1.6.2 1.3 2z"/>
  </symbol>
  <symbol id="i-apple" viewBox="0 0 24 24">
    <path fill="currentColor" d="M17.05 12.5c0-2.1 1.7-3.1 1.8-3.2-1-1.4-2.5-1.6-3-1.7-1.3-.1-2.5.8-3.1.8-.6 0-1.6-.8-2.7-.8-1.4 0-2.7.8-3.4 2-1.5 2.5-.4 6.2 1 8.2.7 1 1.5 2.1 2.6 2 1-.04 1.4-.65 2.7-.65s1.6.65 2.7.63c1.1-.02 1.8-1 2.5-2 .8-1.1 1.1-2.2 1.1-2.3-.02-.01-2.2-.85-2.2-3.03zM15 5.4c.6-.7 1-1.7.9-2.7-.85.04-1.9.57-2.5 1.27-.55.62-1.03 1.63-.9 2.6.95.07 1.9-.48 2.5-1.17z"/>
  </symbol>

  <!-- ── interface glyphs, all stroked ── -->
  <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.2" y="4.8" width="17.6" height="16" rx="2.4"/><path d="M3.2 9.6h17.6M8 2.8v3.6M16 2.8v3.6"/>
  </symbol>
  <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.4 16.6l4.8-5.2 3.4 3 4-4.8 4.9-4.2"/><path d="M16.6 5.4h4v4"/><path d="M3.4 20.6h17.2"/>
  </symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 21h8M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0z"/>
    <path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>
  </symbol>
  <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21.6s7.6-3.8 7.6-9.5V5.2L12 2.4 4.4 5.2v6.9c0 5.7 7.6 9.5 7.6 9.5z"/>
    <path d="M9 12l2.1 2.1L15.2 10"/>
  </symbol>
  <symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.2 8.6a2 2 0 0 1 2-2h1.9l1.3-2.2h7.2l1.3 2.2h1.9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5.2a2 2 0 0 1-2-2z"/>
    <circle cx="12" cy="13" r="3.6"/>
  </symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13.4 2.4L4.2 13.6h6.3l-.9 8 9.2-11.2h-6.3z"/>
  </symbol>
  <symbol id="i-scales" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.4v17.2M7.4 20.6h9.2M4.6 6.6l14.8-1.4"/>
    <path d="M7.6 6.2L4.4 13a3.4 3.4 0 0 0 6.4 0zM16.4 5.4L13.2 12.2a3.4 3.4 0 0 0 6.4 0z"/>
  </symbol>
  <symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9.4" cy="8.2" r="3.6"/><path d="M2.8 20.2a6.6 6.6 0 0 1 13.2 0"/>
    <path d="M16.4 5.1a3.6 3.6 0 0 1 0 6.6M17.8 14.4a6.6 6.6 0 0 1 3.4 5.8"/>
  </symbol>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.4" y="10.2" width="15.2" height="10.4" rx="2.4"/>
    <path d="M8 10.2V7.4a4 4 0 0 1 8 0v2.8"/>
  </symbol>
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round">
    <path d="M6.6 6.6l10.8 10.8M17.4 6.6L6.6 17.4"/>
  </symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round">
    <path d="M12 6.4v11.2M6.4 12h11.2"/>
  </symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.4 12a8.4 8.4 0 1 1-2.5-6"/><path d="M20.6 4.2v5.2h-5.2"/>
  </symbol>
  <!-- A COMPLETE gear.
       The old settings glyph was the Feather "settings" path with its `d`
       truncated part way round: it drew about two thirds of the ring of
       teeth and then simply stopped, so the tab bar had a broken cog in it.
       This is twelve teeth built from one rotated rectangle each, closed
       all the way round, with the hub as a separate circle. -->
  <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64z"/>
    <circle cx="12" cy="12" r="3.2"/>
  </symbol>
  <symbol id="i-arrow-down" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4.6v14.2M6.2 13.4L12 19.2l5.8-5.8"/>
  </symbol>
  <!-- Monochrome G. It takes currentColor like every other glyph here, so
       it follows the theme and cannot go the way an emoji would. -->
  <symbol id="i-google" viewBox="0 0 24 24">
    <path fill="currentColor" d="M21.6 12.23c0-.71-.06-1.4-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-2 3.02v2.5h3.24c1.9-1.74 2.98-4.3 2.98-7.35z"/>
    <path fill="currentColor" d="M12 22c2.7 0 4.96-.9 6.62-2.42l-3.24-2.5c-.9.6-2.05.96-3.38.96-2.6 0-4.8-1.76-5.59-4.12H3.06v2.59A10 10 0 0 0 12 22z"/>
    <path fill="currentColor" d="M6.41 13.92a6 6 0 0 1 0-3.84V7.49H3.06a10 10 0 0 0 0 9.02l3.35-2.59z"/>
    <path fill="currentColor" d="M12 5.98c1.47 0 2.79.51 3.83 1.5l2.87-2.87C16.95 2.99 14.7 2 12 2A10 10 0 0 0 3.06 7.49l3.35 2.59C7.2 7.72 9.4 5.98 12 5.98z"/>
  </symbol>
</defs></svg>
